apiVersion: v2
name: alert-webhooks-chart
description: A Helm chart for Alert Webhooks - Monitoring notification service

# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.0.1

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "v2.0.8"

annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: Added the public GitHub Pages Helm repository release workflow.
    - kind: changed
      description: Use the v2.0.8 multi-platform image by default and disable environment-specific ingress and notification services.
  artifacthub.io/images: |
    - name: alert-webhooks
      image: docker.io/vincent119/alert-webhooks:v2.0.8
      platforms:
        - linux/amd64
        - linux/arm64

# Maintainers information
maintainers:
  - name: vincent119
    email: vincent119@gmail.com

# Keywords for the chart
keywords:
  - monitoring
  - alerting
  - webhooks
  - notifications
  - telegram
  - slack
  - discord

# Home page URL
home: https://github.com/vincent119/alert-webhooks

# Source code URLs
sources:
  - https://github.com/vincent119/alert-webhooks
