apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alert-webhooks-chart.fullname" . }}-secrets
  labels:
    {{- include "alert-webhooks-chart.labels" . | nindent 4 }}
type: Opaque
data:
  # Metric authentication (base64 encoded)
  metric-user: {{ required "secrets.metric.user is required" .Values.secrets.metric.user | b64enc | quote }}
  metric-password: {{ required "secrets.metric.password is required" .Values.secrets.metric.password | b64enc | quote }}
  # Trace authentication (base64 encoded)
  trace-auth-user: {{ .Values.secrets.trace.authUser | b64enc | quote }}
  trace-auth-passwd: {{ .Values.secrets.trace.authPasswd | b64enc | quote }}
  # Webhooks authentication (base64 encoded)
  webhooks-user: {{ required "secrets.webhooks.user is required" .Values.secrets.webhooks.user | b64enc | quote }}
  webhooks-password: {{ required "secrets.webhooks.password is required" .Values.secrets.webhooks.password | b64enc | quote }}
  # Service tokens (base64 encoded)
  telegram-token: {{ if .Values.config.telegram.enable }}{{ required "secrets.telegram.token is required when config.telegram.enable=true" .Values.secrets.telegram.token | b64enc | quote }}{{ else }}""{{ end }}
  slack-token: {{ if .Values.config.slack.enable }}{{ required "secrets.slack.token is required when config.slack.enable=true" .Values.secrets.slack.token | b64enc | quote }}{{ else }}""{{ end }}
  discord-token: {{ if .Values.config.discord.enable }}{{ required "secrets.discord.token is required when config.discord.enable=true" .Values.secrets.discord.token | b64enc | quote }}{{ else }}""{{ end }}
