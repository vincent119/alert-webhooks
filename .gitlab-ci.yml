stages:
  - build_and_push
  - container_scan

variables:
  TimeZone: "Asia/Taipei"
  DOCKER_BUILDKIT: "1"
  GIT_DEPTH: "0"
  GIT_STRATEGY: fetch
  GITLAB_RUNNER_TAGS: "gitlab-runner1-1"

build_and_push_ecr:
  stage: build_and_push
  tags:
    - ${GITLAB_RUNNER_TAGS}
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script: |
    set -euo pipefail
    echo "CI_PROJECT_NAME=${CI_PROJECT_NAME}"
    TAGS="${CI_COMMIT_TAG:-$(git describe --tags --abbrev=0 --always)}"
    if [ -z "${TAGS}" ]; then TAGS="${CI_COMMIT_SHORT_SHA}"; fi
    echo "Resolved TAGS=${TAGS}"

    REPO_NAME="$(echo "${CI_PROJECT_NAME}" | tr '[:upper:]' '[:lower:]')"
    echo "REPO_NAME=${REPO_NAME}"

    if [ -z "${ECR_REGION:-}" ] || [ -z "${ECR_URL:-}" ]; then
      echo "ECR_REGION/ECR_URL is required"; exit 1
    fi

    aws ecr get-login-password --region "${ECR_REGION}" | docker login "${ECR_URL}" --username AWS --password-stdin

    docker run --privileged --rm tonistiigi/binfmt --install linux/amd64,linux/arm64

    docker buildx create --name xbuilder --driver docker-container --use || docker buildx use xbuilder
    docker buildx inspect --bootstrap

    IMAGE="${ECR_URL}/${REPO_NAME}:${TAGS}"
    echo "Target Image: ${IMAGE}"

    docker buildx build \
      --platform linux/amd64,linux/arm64 \
      --build-arg timezone="${TimeZone}" \
      -t "${IMAGE}" \
      --push \
      .

container_cve_scan:
  stage: container_scan
  tags:
    - ${GITLAB_RUNNER_TAGS}
  needs:
    - job: build_and_push_ecr
  allow_failure: true
  cache:
    key: "trivy-db-v2-0.75.0"
    policy: pull-push
    paths:
      - .trivy-cache/
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script: |
    set -euo pipefail
    TAGS="${CI_COMMIT_TAG:-$(git describe --tags --abbrev=0 --always)}"
    if [ -z "${TAGS}" ]; then TAGS="${CI_COMMIT_SHORT_SHA}"; fi

    REPO_NAME="$(echo "${CI_PROJECT_NAME}" | tr '[:upper:]' '[:lower:]')"

    if [ -z "${ECR_REGION:-}" ] || [ -z "${ECR_URL:-}" ]; then
      echo "缺少必要變數：ECR_REGION 或 ECR_URL"; exit 1
    fi

    IMAGE_DIGEST="$(aws ecr describe-images \
      --region "${ECR_REGION}" \
      --repository-name "${REPO_NAME}" \
      --image-ids imageTag="${TAGS}" \
      --query 'imageDetails[0].imageDigest' \
      --output text)"
    if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "None" ]; then
      echo "無法解析 image digest"; exit 1
    fi

    IMAGE_REF="${ECR_URL}/${REPO_NAME}@${IMAGE_DIGEST}"
    TRIVY_CACHE_DIR="${CI_PROJECT_DIR}/.trivy-cache"
    mkdir -p "${TRIVY_CACHE_DIR}"

    scan_image() {
      platform="$1"
      echo "掃描平台：${platform}"
      aws ecr get-login-password --region "${ECR_REGION}" | \
        docker run --rm -i \
          --user "$(id -u):$(id -g)" \
          --volume "${TRIVY_CACHE_DIR}:/tmp/trivy-cache" \
          public.ecr.aws/aquasecurity/trivy:0.75.0 \
          image \
          --cache-dir /tmp/trivy-cache \
          --quiet \
          --skip-version-check \
          --image-src remote \
          --username AWS \
          --password-stdin \
          --scanners vuln \
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
          --format table \
          --exit-code 0 \
          --platform "${platform}" \
          "${IMAGE_REF}"
    }

    scan_image linux/amd64
    scan_image linux/arm64
